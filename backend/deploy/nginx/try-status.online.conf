server {
    listen 80;
    listen [::]:80;
    server_name try-status.online www.try-status.online;

    access_log /var/log/nginx/try-status.access.log;
    error_log /var/log/nginx/try-status.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://try-status.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.try-status.online;

    ssl_certificate /etc/letsencrypt/live/try-status.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/try-status.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TRY_STATUS_SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://try-status.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name try-status.online;

    access_log /var/log/nginx/try-status.ssl.access.log;
    error_log /var/log/nginx/try-status.ssl.error.log;

    ssl_certificate /etc/letsencrypt/live/try-status.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/try-status.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TRY_STATUS_SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /opt/agentroom/current/frontend/dist;
    index index.html;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # The trailing slash strips the public /api/ prefix before proxying.
        proxy_pass http://127.0.0.1:18787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        client_max_body_size 20m;
    }

    location = /index.html {
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # React Router deep links fall back to the Vite entry point. /api and
    # /api/ are handled by the more specific locations above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

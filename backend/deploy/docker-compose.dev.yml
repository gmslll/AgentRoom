# Local development infrastructure for AgentRoom backend.
# Brings up Redis (rate limiting / fan-out / presence) and MinIO (S3-compatible
# object storage) so the distributed paths can be exercised without cloud
# accounts. Production deployments run the same services externally.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# Redis:  redis://127.0.0.1:6379
# MinIO:  http://127.0.0.1:9000  (console: http://127.0.0.1:9001)
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: agentroom
      MINIO_ROOT_PASSWORD: agentroom-dev-password
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://127.0.0.1:9000 agentroom agentroom-dev-password >/dev/null 2>&1 && mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio-data:
